<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Udi Ja!</title>
<meta name="description" content="Udi Ja! is a Tihar kite-fighting game. Cut rival strings over the Festival Square and be the last kite flying.">
<meta property="og:type" content="website">
<meta property="og:title" content="Udi Ja! · Tihar Kite Club">
<meta property="og:description" content="Cut rival strings and be the last kite flying in this Tihar festival kite game.">
<meta property="og:image" content="og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Udi Ja! logo over the Festival Square at dusk">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Udi Ja! · Tihar Kite Club">
<meta name="twitter:description" content="Cut rival strings and be the last kite flying in this Tihar festival kite game.">
<meta name="twitter:image" content="og-image.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<div class="brand">
<img class="club-mark" src="club-mark.svg" width="39" height="39" alt=""> Udi <b>Ja!</b>
</div>
<nav>
<button id="sound" aria-pressed="false">
<svg aria-hidden="true" viewBox="0 0 24 24">
<path d="M3 9h4l5-4v14l-5-4H3z"/>
<path class="mute" d="m16 9 5 6m0-6-5 6"/>
<path class="waves" d="M16 8q4 4 0 8m3-11q7 7 0 14"/>
</svg>
<span>Music off</span>
</button>
<button id="help">How to play</button>
</nav>
</header>
<main>
<section id="sky">
<div class="shade">
</div>
<div id="cover">
<small>
<i>
</i> FESTIVAL OF LIGHTS</small>
<h1>Udi Ja!</h1><p>Tihar Kite Club</p>
</div>
<div id="posterKites">
</div>
<div id="location">KATHMANDU VALLEY, NEPAL</div>
<canvas id="arena">
</canvas>
<div id="hud" hidden>
<b id="stats">
</b>
<button id="pause">Pause</button>
</div>
<div id="reel">
</div>
<div id="moves">
<button id="dash">Dodge · Shift</button>
<button id="guard">Brace F</button>
</div>
<div id="touch">
<div id="stick">
<i>
</i>
</div>
<button id="cut">CUT</button>
</div>
</section>
<section id="setup">
<div class="title">
<h2>Flight setup</h2>
<hr>
</div>
<div class="options">
<div>
<h3>GAME MODE</h3>
<div id="modes">
<button data-mode="survival" class="selected">
<strong>Last Kite Flying</strong>
<small>Be the last kite in the sky</small>
</button>
<button data-mode="rush">
<strong>Rush Mode</strong>
<small>90-second score chase</small>
</button>
</div>
</div>
<div>
<h3>DIFFICULTY</h3>
<div id="levels">
<button>Easy</button>
<button class="selected">Normal</button>
<button>Hard</button>
</div>
</div>
<div>
<h3>KITE SHOP <span id="kn">
</span>
</h3>
<div id="skins">
</div>
</div>
</div>
<h3 id="sceneryTitle">FLYING GROUNDS</h3>
<div id="grounds" role="group" aria-labelledby="sceneryTitle">
<button data-ground="valley" style="--scene:url(valley.svg)">
<i>
</i>Kathmandu Valley</button>
<button data-ground="night" style="--scene:url(night.svg)">
<i>
</i>Tihar Rooftops</button>
<button data-ground="lake" style="--scene:url(lake.svg)">
<i>
</i>Lakeside Diyas</button>
<button data-ground="fields" style="--scene:url(fields.svg)">
<i>
</i>Marigold Terraces</button>
<button data-ground="square" style="--scene:url(square.svg)">
<i>
</i>Festival Square</button>
</div>
<button id="launch">Launch kite</button>
<div id="friends">
<div class="title">
<h2>Play with friends</h2>
<hr>
</div>
<p id="friendsInfo">Fly together with 2–3 players. Create a lobby and share its code or invite link. Last kite flying wins.</p>
<label id="nameRow">Your name <input id="pname" maxlength="12" placeholder="Pilot" autocomplete="off" autocapitalize="words" spellcheck="false"></label>
<div id="friendsHome">
<div class="friendRow">
<button id="createLobby">Create lobby</button>
<span>or join</span>
<input id="joinCode" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Lobby code">
<button id="joinLobby">Join</button>
</div>
</div>
<div id="lobbyRoom" hidden>
<div class="codeBox">
<div>
<small>LOBBY CODE</small>
<strong id="lobbyCode"></strong>
</div>
<button id="shareLobby">Share invite</button>
</div>
<ul id="roster"></ul>
<p id="lobbyHint"></p>
<div class="friendRow">
<button id="startMatch">Start match</button>
<button id="leaveLobby">Leave lobby</button>
</div>
</div>
<p id="mpNote" role="status"></p>
</div>
</section>
</main>
<dialog id="modal">
<h2 id="mt">
</h2>
<p id="mb">
</p>
<div id="actions">
</div>
</dialog>
<script src="game.js">
</script>
<script src="multiplayer.js">
</script>
</body>
</html>
